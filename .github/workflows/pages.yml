name: Deploy ad admin panel to GitHub Pages
# The admin/ folder is published as the site root, so use / rather than /admin/ in the public URL.
on:
  push:
    branches: ["main"]
    paths:
      - "admin/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload admin panel only
        uses: actions/upload-pages-artifact@v3
        with:
          path: "admin"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
